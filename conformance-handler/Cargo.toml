[package]
name = "conformance-handler"
version = "0.0.1"
edition = "2021"
publish = false
description = "Handler binary for the kernel-bindings-tests conformance suite"

# Kept out of the root workspace so its dependencies do not affect the
# MSRV-pinned Cargo-minimal.lock / Cargo-recent.lock files.
[workspace]

[dependencies]
bitcoinkernel = { path = ".." }
hex = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
