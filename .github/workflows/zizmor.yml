name: Zizmor

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zizmor:
    name: Audit GitHub Actions
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    # Audit only what this repository maintains. Bitcoin Core is vendored as
    # a submodule and ships its own workflows; it is not checked out here,
    # but the explicit path keeps that true if that ever changes.
    - name: Run zizmor
      run: pipx run zizmor==1.30.1 --format=github .github/workflows
      env:
        GH_TOKEN: ${{ github.token }}
